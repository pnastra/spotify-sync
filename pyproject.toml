[project]
name = "spotify-sync"
version = "0.1.0"
description = "Mirror Spotify playlists into per-playlist MP3 folders via spotdl sync"
requires-python = ">=3.10"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
